<style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f5;color:#202720;font:15px/1.7 Arial,"Microsoft YaHei",sans-serif;--paper:#fff;--line:#dedfd9;--muted:#69736c}body.dark{background:#0c1520;color:#e0ecf0;--paper:#101f2b;--line:#263a46;--muted:#9eb5bc}main{max-width:1420px;margin:auto;padding:32px 24px 60px}nav,header,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}nav{justify-content:space-between}a{color:inherit;text-decoration:none}h1{font:400 clamp(30px,4vw,52px)/1.2 Georgia,serif;margin:28px 0 12px}p{color:var(--muted);margin:4px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}article{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:20px}h2{font:500 18px/1.4 Arial,sans-serif;margin:0}h2 small{font-size:12px;font-weight:400;color:var(--muted);display:block;margin-top:4px}.stage{position:relative;aspect-ratio:1;max-width:640px;margin:12px auto}.stage>canvas{display:block;width:100%;height:100%}.lotus-frame{position:absolute;inset:0;background: center / contain no-repeat}.lotus-frame.has-art-loop{background-size:0}.art-loop-canvas{display:block;width:100%;height:100%;object-fit:contain}.art-loop-canvas[hidden]{display:none!important}button{font:inherit;font-size:14px;background:var(--paper);color:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer}button:hover{border-color:#599ab0}button[aria-pressed=true]{border-color:#6aabbc;background:#93cbd91a}button:focus-visible{outline:2px solid #479fb3;outline-offset:3px}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#468498}.foot{font-size:13px;max-width:1000px}.native{width:1280px!important;max-width:none!important}.full .grid{display:block}.full article:first-child{display:none}.full .stage{max-width:900px}.loading{color:#8d6938}#seek{width:160px}output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}@media(max-width:760px){main{padding:20px 12px}.grid{grid-template-columns:1fr}article{padding:14px}}

<main><nav><a href="https://li2ga.github.io/">← Jia Li · 个人主页</a><div class="controls"><button id="tone">深色背景</button><button id="full">单幅大图</button></div></nav><span class="tag">Volumetric combustion · cold lotus</span><h1>A living flame.</h1><p>青蓝光焰从莲瓣后方升起，细小流光掠过瓣缘。</p>
<div class="grid"><article><h2>当前主页版本<small>原图细纹与短火舌流动</small></h2><div class="page-atmosphere" data-art-motion="loop" data-art-scope="gallery" data-background-current="lotus"><div data-background-scene="lotus" data-active><div class="stage" data-lotus-instance="0" data-lotus-stage="1"><span class="lotus-frame" data-lotus-frame="1"></span></div></div></div></article><article><h2>三年之约 · 光焰版<small>青蓝焰芯、淡紫焰尖、沿莲瓣游走的亮屑</small></h2><div class="stage"><canvas id="view" width="1280" height="1280"></canvas></div></article></div>
<div class="controls"><button id="play" aria-pressed="true">暂停</button><button id="snow" aria-pressed="true">40 片飘雪：开</button><button id="fire" aria-pressed="true">光焰：开</button><input id="seek" type="range" min="0" max="95" value="0" aria-label="动画帧"><output id="time">载入模拟帧…</output></div><p id="status" class="foot loading">正在载入三维光焰。</p><p class="foot">莲体为原图派生的完整分层素材；原文件保留。新增 40 片雪花向下飘落。此页用于对比新动态，主页仍使用左侧版本。</p></main>
<script src="art-loops.js?v=3bbf1c48f8fa"></script><script src="lotus-duel-light.js?v=6d6defe1a5d2"></script><script>
(async()=>{
const load=async url=>{const i=new Image();i.src=url;await i.decode();return i};
const motionFile='assets/previews/cold-volumetric-fire-v2.webp',stillFile='assets/previews/cold-volumetric-fire-still-v2.png';
const [original,body,poster]=await Promise.all([load('assets/backgrounds/fire-lotus-cold-v1.png'),load('assets/backgrounds/fire-lotus-cold-body-v1.png'),load('assets/previews/cold-volumetric-fire-still-v2.png')]);
const root=document.querySelector('.page-atmosphere'),item=root.querySelector('[data-lotus-instance]'),host=root.querySelector('.lotus-frame');host.style.backgroundImage='url("assets/backgrounds/fire-lotus-cold-v1.png")';JiaArtLoops.lotus(item,1,original);
const canvas=document.querySelector('#view'),c=canvas.getContext('2d'),status=document.querySelector('#status'),seek=document.querySelector('#seek'),clock=document.querySelector('#time');
let playing=!matchMedia('(prefers-reduced-motion:reduce)').matches,snow=true,fire=true,decoder=null,frameCount=64,frameIndex=0,last=performance.now(),decoding=false,decoded=await createImageBitmap(poster),t=0,ready=false,nativeMode=false;
function flakes(ms){c.save();c.strokeStyle='rgb(87,177,213)';c.lineWidth=1280/600;for(let i=0;i<40;i++){const sec=ms/1000,phase=(sec*(.026+(i%5)*.004)+i*.61803398875)%1,x=.07+((i*.754877666)%1)*.86+.035*Math.sin(sec*.53+i*2.1)+.018*Math.sin(sec*1.17+i),y=phase*1.12-.06,size=1280*(.004+(i%4)*.0018);c.save();c.translate(x*1280,y*1280);c.rotate(sec*.23+i);c.globalAlpha=Math.sin(phase*Math.PI)*(.53+(i%3)*.11);c.beginPath();for(let a=0;a<6;a++){const th=a*Math.PI/3,dx=Math.cos(th),dy=Math.sin(th);c.moveTo(0,0);c.lineTo(dx*size,dy*size);for(const s of[-1,1]){c.moveTo(dx*size*.62,dy*size*.62);c.lineTo(dx*size*.43+Math.cos(th+s*Math.PI/2)*size*.23,dy*size*.43+Math.sin(th+s*Math.PI/2)*size*.23)}}c.stroke();c.restore()}c.restore()}
function draw(){
 c.clearRect(0,0,1280,1280);
 const dark=document.body.classList.contains('dark');
 if(fire){if(decoded)c.drawImage(decoded,0,0,1280,1280);drawLotusLight(c,t,false,dark)}
 c.drawImage(body,0,0,1280,1280);
 if(fire)drawLotusLight(c,t,true,dark);
 if(snow)flakes(t);
 clock.value=(frameIndex/24).toFixed(2)+' s · '+(frameIndex+1)+' / '+frameCount;seek.value=frameIndex;
}
async function decode(index){if(!decoder||decoding)return;decoding=true;try{const r=await decoder.decode({frameIndex:index,completeFramesOnly:true});decoded?.close();decoded=r.image;frameIndex=index;draw()}catch(e){status.textContent='动态帧解码失败：'+e.message}finally{decoding=false}}
function tick(now){if(playing){t=now;if(ready&&!decoding&&now-last>=1000/24){last=now-((now-last)%(1000/24));decode((frameIndex+1)%frameCount)}else draw()}requestAnimationFrame(tick)}
document.querySelector('#tone').onclick=e=>{const dark=document.body.classList.toggle('dark');e.target.textContent=dark?'浅色背景':'深色背景';draw()};
document.querySelector('#full').onclick=e=>{const full=document.body.classList.toggle('full');e.target.textContent=full?'并排对比':'单幅大图'};
const updatePlay=()=>{const b=document.querySelector('#play');b.textContent=playing?'暂停':'播放';b.setAttribute('aria-pressed',playing)};updatePlay();
document.querySelector('#play').onclick=()=>{playing=!playing;updatePlay()};
document.querySelector('#snow').onclick=e=>{snow=!snow;e.target.textContent='40 片飘雪：'+(snow?'开':'关');e.target.setAttribute('aria-pressed',snow);JiaArtLoops.setColdSnow(snow);draw()};
document.querySelector('#fire').onclick=e=>{fire=!fire;e.target.textContent='光焰：'+(fire?'开':'关');e.target.setAttribute('aria-pressed',fire);draw()};
seek.oninput=()=>{playing=false;updatePlay();t=+seek.value*(1000/24);decode(+seek.value)};
window.LotusFluidPreview={inspect:()=>({ready,frameCount,frameIndex,playing,snowCount:snow?40:0,sourceResolution:[1280,1280],engine:'Mantaflow 3D gas combustion',wholeLotusRotation:false,nativeMode,layering:"fire behind the complete crystal body"}),pause:()=>{playing=false;updatePlay()},seek:decode};
draw();requestAnimationFrame(tick);
try{if(!window.ImageDecoder){nativeMode=true;ready=true;frameCount=64;decoded?.close();decoded=null;draw();
 const layer=document.createElement('img');layer.src=playing?motionFile:stillFile;
 layer.alt='';layer.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';canvas.style.position='relative';canvas.before(layer);seek.disabled=true;
 document.querySelector('#play').addEventListener('click',()=>layer.src=playing?motionFile:stillFile);
 document.querySelector('#fire').addEventListener('click',()=>layer.hidden=!fire);
 status.classList.remove('loading');status.textContent='三维气体光焰 · 透明动图播放';return;
 }const response=await fetch(motionFile);if(!response.ok)throw Error(response.status);
 const data=await response.arrayBuffer();decoder=new ImageDecoder({data,type:'image/webp',preferAnimation:true});await decoder.tracks.ready;last=performance.now();frameCount=decoder.tracks.selectedTrack.frameCount;seek.max=frameCount-1;await decode(0);ready=true;status.classList.remove('loading');status.textContent='三维气体模拟已载入 · 1280 × 1280 · 24 fps · 透明无损 WebP';}catch(e){status.textContent='动态文件尚未就绪：'+e.message}
})();
</script></html>
