name: Refresh public statistics snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-statistics-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch the original site's public aggregates
        run: python3 tools/update_public_stats.py
      - name: Save snapshot without touching website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/analytics/summary.json assets/analytics/visitor-map.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public statistics snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh the existing branch-based Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          request=urllib.request.Request(
              'https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/pages/builds',
              method='POST',data=b'{}',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
              })
          with urllib.request.urlopen(request,timeout=30) as response:
              build=json.load(response)
              print('Pages build requested:',build.get('status','queued'))
          PY
