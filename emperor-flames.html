const plates=["assets/heavenly-flames/plate-01-v1.png?v=16e77b274ba3", "assets/heavenly-flames/plate-02-v1.png?v=654b84931f88", "assets/heavenly-flames/plate-03-v1.png?v=1c6f7a924420", "assets/heavenly-flames/plate-04-v1.png?v=34315d9ae831"],names=["帝炎", "虚无吞炎", "净莲妖火", "金帝焚天炎", "生灵之焱", "八荒破灭焱", "九幽金祖火", "红莲业火", "三千焱炎火", "九幽风炎", "骨灵冷火", "九龙雷罡火", "龟灵地火", "陨落心炎", "海心焰", "火云水炎", "火山石焰", "风怒龙炎", "青莲地心火", "幽冥毒火", "阴阳双炎", "万兽灵火", "玄黄炎"],root=document.querySelector('.page-atmosphere'),source=document.querySelector('#source'),live=document.querySelector('#live'),select=document.querySelector('#rank'),cache=new Map();
let generation=0;
async function show(rank){const token=++generation;select.value=String(rank);const url=plates[Math.floor((rank-1)/6)],cell=(rank-1)%6;let image=cache.get(url);if(!image){image=new Image();image.src=url;cache.set(url,image)}await image.decode();if(token!==generation)return;for(const host of[source,live]){host.style.backgroundImage=`url("${url}")`;host.style.setProperty('--x',String(cell%3*50)+'%');host.style.setProperty('--y',String(Math.floor(cell/3)*100)+'%')}live.dataset.emperorFlame=String(rank);JiaArtLoops.emperorFlame(live,image,rank);document.querySelector('#name').textContent=names[rank-1];document.querySelector('#character').textContent=JiaArtLoops.emperorProfiles()[rank-1].motion;const urlState=new URL(location.href);urlState.searchParams.set('rank',rank);history.replaceState(null,'',urlState)}
select.onchange=()=>show(Number(select.value));document.querySelector('#previous').onclick=()=>show((Number(select.value)+21)%23+1);document.querySelector('#next').onclick=()=>show(Number(select.value)%23+1);document.querySelector('#tone').onclick=e=>{document.body.classList.toggle('light');e.currentTarget.textContent=document.body.classList.contains('light')?'深色背景':'浅色背景'};document.querySelector('#motion').onclick=e=>{const run=root.dataset.artMotion==='still';root.dataset.artMotion=run?'loop':'still';e.currentTarget.textContent=run?'暂停动态':'播放动态';e.currentTarget.setAttribute('aria-pressed',String(run));JiaArtLoops.wake()};show(Math.min(23,Math.max(1,Number(new URLSearchParams(location.search).get('rank'))||19)));
